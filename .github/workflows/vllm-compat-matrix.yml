name: Bielik vLLM Compatibility Matrix

on:
  push:
    branches:
      - feat/osa-tool-parser-proof-suite
    paths:
      - "scripts/vllm_compat_probe.py"
      - ".github/workflows/vllm-compat-matrix.yml"
      - "tools/bielik_vllm_tool_parser*.py"
      - "tests/test_bielik_tool_parser.py"
      - "tests/test_source_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Parser unit regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run parser regression suite
        run: python -m pytest -q tests/test_bielik_tool_parser.py tests/test_source_contract.py

  probe:
    name: vLLM ${{ matrix.version }} / ${{ matrix.parser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "0.18.0"
            parser: "tools/bielik_vllm_tool_parser_v0.15.0.py"
          - version: "0.19.0"
            parser: "tools/bielik_vllm_tool_parser_v0.15.0.py"
          - version: "0.20.0"
            parser: "tools/bielik_vllm_tool_parser_v0.15.0.py"
          - version: "0.23.0"
            parser: "tools/bielik_vllm_tool_parser_v0.15.0.py"
          - version: "0.24.0"
            parser: "tools/bielik_vllm_tool_parser.py"
          - version: "0.31.0"
            parser: "tools/bielik_vllm_tool_parser.py"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe published vLLM wheel
        run: |
          mkdir -p evidence
          safe_version="${{ matrix.version }}"
          python scripts/vllm_compat_probe.py \
            --version "${{ matrix.version }}" \
            --parser "${{ matrix.parser }}" \
            --output "evidence/vllm-${safe_version}.json"

      - name: Publish step summary
        if: always()
        run: |
          {
            echo "## vLLM ${{ matrix.version }}"
            echo
            echo '```json'
            cat "evidence/vllm-${{ matrix.version }}.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vllm-${{ matrix.version }}-compat-evidence
          path: evidence/vllm-${{ matrix.version }}.json
          if-no-files-found: error

      - name: Assert compatibility verdict
        env:
          VLLM_VERSION: "${{ matrix.version }}"
        run: |
          python - <<'PY'
          import json
          import os

          version = os.environ["VLLM_VERSION"]
          path = f"evidence/vllm-{version}.json"
          with open(path, encoding="utf-8") as fh:
              result = json.load(fh)

          verdict = result.get("verdict")
          risks = result.get("risks", [])
          print(f"vLLM {version}: verdict={verdict}, risks={risks}")
          if verdict != "COMPATIBLE_API_SHAPE":
              raise SystemExit(1)
          PY
